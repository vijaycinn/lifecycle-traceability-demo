name: PR Traceability Gate
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
jobs:
  require-issue-link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            const hasLink = /((close[sd]?|fix(e[sd])?|resolve[sd]?|refs)\s+#\d+|AB#\d+)/i.test(body);
            if (!hasLink) {
              core.setFailed('PR description must link an Issue or Work Item (e.g., Fixes #4, Refs #3, or AB#7).');
            }